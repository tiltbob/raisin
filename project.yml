# XcodeGen spec for EarDigger.xcodeproj. The generated project is committed so the app
# opens straight in Xcode; after changing this file (or adding/removing source files) run
#   xcodegen generate
# with XcodeGen 2.46.0 (CI checks that the committed project matches).
name: EarDigger
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
  usesTabs: false
  indentWidth: 4
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  EarDiggerKit:
    path: EarDiggerKit
targets:
  EarDigger:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/EarDigger.xcconfig
      Release: Config/EarDigger.xcconfig
    sources:
      - path: EarDigger
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: EarDiggerKit
    settings:
      base:
        INFOPLIST_FILE: EarDigger/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
schemes:
  EarDigger:
    build:
      targets:
        EarDigger: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
